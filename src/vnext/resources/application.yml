facility:
  name: SNS
  root: /SNS

# IPTS.root mirrors facility.root so both spellings resolve to the same base path.
IPTS:
  root: ${facility.root}

instrument:
  name: VULCAN
  home: ${IPTS.root}/VULCAN
  data:
    # {IPTS} and {run} are runtime template placeholders, not config substitutions
    home: ${instrument.home}/IPTS-{IPTS}/nexus
    file: ${instrument.data.home}/VULCAN_{run}.nxs.h5
  calibration:
    home: ${instrument.home}/shared/CALIBRATION
  reduction:
    # {IPTS} is a runtime template placeholder, not a config substitution.
    home: ${instrument.home}/IPTS-{IPTS}/shared/VNext
    bin: ${instrument.reduction.home}/binned_data
  startingRunNumber: 1000

  nexus:
    native:
      prefix: nexus/VULCAN_
      extension: .nxs.h5
    start_time_log: /entry/start_time
    das_logs: /entry/DASlogs

  PVLogs:
    rootGroup: /entry/DASlogs
    startTime: entry/start_time

    # Each entry is either a single log name, or a list of alternatives where the
    # first is the current preferred name and the rest are older aliases tried in
    # order if the preferred name is absent (mirrors SNAPRed's instrumentKeys pattern).
    choppers:
      # Skf34 pair: 20 Hz, standard wide-range frame used for powder reduction
      skf34:
        wavelength:
          - BL7:Chop:Skf34:CenterWavelength  # current
          - skf34.lambda                       # pre-upgrade alias
        speed:
          - BL7:Chop:Skf34:SpeedReq           # current
          - skf34.speed_req                    # pre-upgrade alias
        bandwidth: BL7:Chop:Skf34:Bandwidth
      # Skf12 pair: 60 Hz, short-wavelength frame
      skf12:
        wavelength:
          - BL7:Chop:Skf12:CenterWavelength   # current
          - lambda                              # pre-upgrade alias
        speed:
          - BL7:Chop:Skf12:SpeedReq            # current
          - frequency                           # pre-upgrade alias
        bandwidth: BL7:Chop:Skf12:Bandwidth
